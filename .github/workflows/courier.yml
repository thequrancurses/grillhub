name: Build Courier APK

on:
  push:
    paths:
      - 'courier/**'
      - '.github/workflows/courier.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
        shell: bash
        working-directory: courier

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: courier-${{ github.run_number }}
          name: Delivery (courier) APK ${{ github.run_number }}
          make_latest: "false"
          files: courier/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build log (for debugging)
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buildlog-courier
          name: courier build log
          prerelease: true
          make_latest: "false"
          files: courier/build.log
