plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.grillhub.courier'
    compileSdk 34

    defaultConfig {
        applicationId 'pl.grillhub.courier'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
