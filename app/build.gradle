plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.grillhub.kitchen'
    compileSdk 34

    defaultConfig {
        applicationId 'pl.grillhub.kitchen'
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName '6.5'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
