plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.grillhub.kitchen'
    compileSdk 34

    defaultConfig {
        applicationId 'pl.grillhub.kitchen'
        minSdk 26
        targetSdk 34
        versionCode 14
        versionName '6.7'
    }

    // Same signing key for every build (CI runners otherwise generate a new debug key each run,
    // which makes Android refuse to install a new APK over an older one: "App not installed").
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
